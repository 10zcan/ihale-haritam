<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,user-scalable=yes">
<title>Türkiye İş Makinesi İhale Haritası</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0b1120;color:#f8fafc;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
header h1{font-size:15px;color:#f59e0b}
.btn-add{background:#f59e0b;color:#0f172a;border:none;padding:7px 11px;border-radius:8px;font-weight:700;font-size:12px}
.s-bar{padding:7px 12px;background:#162032;border-bottom:1px solid #334155;display:flex;gap:8px;align-items:center}
.s-bar input{flex:1;padding:8px;border-radius:8px;border:1px solid #475569;background:#0b1120;color:#fff;font-size:13px;margin:0}
.status-dot{font-size:11px;color:#4ade80;white-space:nowrap}
.m-wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:6px;overflow:auto;background:radial-gradient(circle,#162238,#0b1120)}
svg{width:100%;height:auto;max-height:63vh}
.strip{display:flex;gap:6px;overflow-x:auto;width:100%;padding:8px 12px;background:#1e293b;border-top:1px solid #334155}
.chip{background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:6px 12px;border-radius:16px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.act{border-color:#f59e0b}
.chip span{background:#334155;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px}
.chip.act span{background:#f59e0b;color:#0f172a}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top-left-radius:20px;border-top-right-radius:20px;padding:16px;max-height:84vh;overflow-y:auto;transform:translateY(100%);transition:.25s;z-index:2000;border-top:2px solid #f59e0b}
.drawer.open{transform:translateY(0)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #334155}
.c-btn{background:#334155;color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:15px}
select,input,textarea{width:100%;padding:9px;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #475569;font-size:13px;margin-bottom:8px}
.tabs,.ttabs{display:flex;gap:5px;margin-bottom:8px}
.tab,.ttab{flex:1;padding:8px 4px;text-align:center;background:#0f172a;border-radius:8px;font-size:11.5px;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.tab.active{background:#f59e0b;color:#0f172a;font-weight:700}
.ttab.active{background:#3b82f6;color:#fff;font-weight:700}
.card{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:8px}
.bdgs{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.bdg{font-size:10px;padding:3px 6px;border-radius:5px;font-weight:700}
.ba{background:rgba(34,197,94,.2);color:#4ade80}.bp{background:rgba(148,163,184,.2);color:#94a3b8}
.bh{background:rgba(59,130,246,.2);color:#60a5fa}.by{background:rgba(245,158,11,.2);color:#fbbf24}.bd{background:#1e293b;color:#e2e8f0}
.bout{background:rgba(239,68,68,.2);color:#f87171}
.card h3{font-size:13.5px;margin-bottom:4px;line-height:1.35}.card p{font-size:12px;color:#cbd5e1;margin-bottom:5px}
.cm{display:flex;justify-content:space-between;font-size:11px;color:#f59e0b;border-top:1px solid #1e293b;padding-top:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:3000;padding:14px;align-items:center;justify-content:center}
.modal.open{display:flex}
.mbox{background:#1e293b;width:100%;max-width:420px;border-radius:16px;padding:16px;border:1px solid #475569;max-height:90vh;overflow-y:auto}
.bsave{width:100%;background:#22c55e;color:#0f172a;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.bbulk{width:100%;background:#3b82f6;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:14px}
.dr{padding:7px 0;border-bottom:1px solid #334155;font-size:13px}.dr span{color:#94a3b8;display:block;font-size:11px}
.emp{text-align:center;color:#94a3b8;padding:20px 0;font-size:13px}
</style>
</head>

<div class="strip" id="strip"></div>
<div class="drawer" id="drw"><div class="dh"><strong id="sc" style="font-size:17px">İl</strong><button class="c-btn" onclick="closeD()">✕</button></div><select id="df" onchange="rList()"><option value="ALL">Tüm İlçeler</option></select><div class="tabs"><div class="tab active" id="ta" onclick="sTab('active')">Olacak İhaleler</div><div class="tab" id="tp" onclick="sTab('past')">Olmuş İhaleler</div><div class="tab" id="tf" onclick="sTab('firms')">Top Müteahhitler</div></div><div class="ttabs" id="typBar"><div class="ttab active" id="tALL" onclick="sTyp('ALL')">Tümü</div><div class="ttab" id="tHizmet" onclick="sTyp('Hizmet')">Hizmet Alımı</div><div class="ttab" id="tYapım" onclick="sTyp('Yapım')">Yapım İşi</div></div><div id="list"></div></div>
<div class="modal" id="dm"><div class="mbox"><div class="dh"><strong>İhale Detayı</strong><button class="c-btn" onclick="closeDet()">✕</button></div><div id="dc"></div></div></div>
<div class="modal" id="am"><div class="mbox">
<div class="dh"><strong>Yeni İhale Ekle</strong><button class="c-btn" onclick="closeM()">✕</button></div>
<div class="tabs"><div class="tab active" id="mSingle" onclick="swMode('single')">Tekli Ekle</div><div class="tab" id="mBulk" onclick="swMode('bulk')">Toplu Yapıştır</div></div>
<div id="boxSingle">
<select id="ic"></select><input id="idst" placeholder="İlçe (Örn: Merkez, Sungurlu)"><select id="itp"><option value="Yapım">Yapım İşi (Hafriyat/Altyapı)</option><option value="Hizmet">Hizmet Alımı (Kiralama)</option></select><select id="ist"><option value="past">Olmuş (Sonuçlandı)</option><option value="active">Olacak (Aktif)</option></select><input id="itl" placeholder="İhale Başlığı"><input id="ior" placeholder="Kurum / Kazanan Firma"><textarea id="idc" rows="2" placeholder="Makine & İş Detayı"></textarea><input id="idt" placeholder="İKN & Tarih"><button class="bsave" onclick="save()">Haritaya Kaydet</button>
</div>
<div id="boxBulk" style="display:none">
<textarea id="bulkTxt" rows="7" placeholder="Hazır listeyi buraya toplu yapıştırın..."></textarea>
<button class="bbulk" onclick="saveBulk()">Hepsini Haritaya Aktar</button>
</div>
</div></div>

async function loadLive(){
try{
const r=await fetch('ihaleler.json?t='+Date.now());
if(r.ok){
const live=await r.json();
const local=JSON.parse(localStorage.getItem('myTendersV2'))||[];
const titles=new Set(live.map(x=>x.title));
T=[...live,...local.filter(x=>!titles.has(x.title))];

function render(ft=""){
const ly=document.getElementById('pins'),st=document.getElementById('strip');let svg="",str="";

const ac=T.filter(t=>t.city===c.n).length,isA=ac>0,r=isA?12:8.5;
svg+=`<g onclick="openD('${c.n}')" style="cursor:pointer"><circle cx="${c.x}" cy="${c.y}" r="${r}" fill="${isA?'#f59e0b':'#1e293b'}" stroke="${isA?'#fff':'#64748b'}" stroke-width="${isA?2.5:1.5}"/><text x="${c.x}" y="${c.y+3.2}" font-size="8.5" font-weight="bold" fill="${isA?'#0f172a':'#94a3b8'}" text-anchor="middle">${isA?ac:c.p}</text><text x="${c.x}" y="${c.y+r+8.5}" font-size="7.5" font-weight="600" fill="${isA?'#fbbf24':'#94a3b8'}" text-anchor="middle">${c.n}</text></g>`;

});ly.innerHTML=svg;st.innerHTML=str;
}
function openD(cn){
curC=cn;document.getElementById('sc').textContent=cn+" İhale & Piyasa";
const co=C.find(c=>c.n===cn),ds=document.getElementById('df');
ds.innerHTML='<option value="ALL">Tüm İlçeler ('+cn+')</option>';
if(co&&co.d)co.d.split(',').forEach(d=>ds.innerHTML+=`<option value="${d}">${d}</option>`);
T.filter(t=>t.city===cn&&t.district).forEach(t=>{if(![...ds.options].some(o=>o.value===t.district))ds.innerHTML+=`<option value="${t.district}">${t.district}</option>`});
document.getElementById('drw').classList.add('open');rList();
}
function closeD(){document.getElementById('drw').classList.remove('open')}
function sTab(t){
curTab=t;
document.getElementById('ta').classList.toggle('active',t==='active');
document.getElementById('tp').classList.toggle('active',t==='past');
document.getElementById('tf').classList.toggle('active',t==='firms');
document.getElementById('typBar').style.display=t==='firms'?'none':'flex';
document.getElementById('df').style.display=t==='firms'?'none':'block';
if(t==='firms')loadFirms();else rList();
}
function sTyp(t){curType=t;['ALL','Hizmet','Yapım'].forEach(x=>document.getElementById('t'+x).classList.toggle('active',x===t));rList()}
async function loadFirms(){
const el=document.getElementById('list');
el.innerHTML='<div class="emp">İhaleGlobal EKAP kayıtlarından müteahhitler çekiliyor...</div>';
const apiIl=curC==="K.Maraş"?"KAHRAMANMARAŞ":curC==="Afyon"?"AFYONKARAHİSAR":curC.toLocaleUpperCase('tr-TR');
try{
if(!firmCache[apiIl]){
const res=await fetch(`https://ihaleglobal.com{encodeURIComponent(apiIl)}&order=sira.asc`,{headers:{apikey:IG_KEY}});
firmCache[apiIl]=await res.json();
}
const list=firmCache[apiIl]||[];
if(!list.length){el.innerHTML='<div class="emp">Bu il için firma kaydı bulunamadı.</div>';return}
el.innerHTML=list.map(f=>{
const isOut=f.firma_il&&f.firma_il.toLocaleUpperCase('tr-TR')!==apiIl;
const mBedel=Math.round((f.bedel||0)/1000000);
return `<div class="card"><div class="bdgs"><span class="bdg by">#${f.sira} YÜKLENİCİ</span><span class="bdg ${isOut?'bout':'ba'}">${isOut?'📍 İl Dışı: '+f.firma_il:'✓ Yerel: '+f.firma_il}</span></div><h3>${f.firma}</h3><p>${f.sozlesme_sayisi} Sözleşme · Toplam Hacim: ~${mBedel} Milyon TL</p><div class="cm"><span>Kaynak: İhaleGlobal EKAP Özeti</span><span>Taşeronluk Hedefi</span></div></div>`;
}).join('');
}catch(e){el.innerHTML='<div class="emp">Bağlantı hatası oluştu.</div>';}
}
function rList(){
const el=document.getElementById('list'),sd=document.getElementById('df').value;
const fl=T.filter(t=>t.city===curC&&t.status===curTab&&(sd==="ALL"||(t.district&&t.district.toLowerCase()===sd.toLowerCase()))&&(curType==="ALL"||t.type===curType));
if(!fl.length){el.innerHTML='<div class="emp">Bu filtrede ihale bulunmuyor.</div>';return}
el.innerHTML=fl.map(t=>{const ri=T.indexOf(t);return `<div class="card" onclick="sDet(${ri})"><div class="bdgs"><span class="bdg ${t.status==='active'?'ba':'bp'}">${t.status==='active'?'● OLACAK':'✓ OLMUŞ'}</span><span class="bdg ${t.type==='Hizmet'?'bh':'by'}">${t.type==='Hizmet'?'HİZMET ALIMI':'YAPIM İŞİ'}</span>${t.district?`<span class="bdg bd">📍 ${t.district}</span>`:''}</div><h3>${t.title}</h3><p>${t.org||''}</p><div class="cm"><span>📅 ${t.date}</span><span>Detay →</span></div></div>`}).join('');
}
function sDet(i){
const t=T[i];
