async function loadLive(){
try{
const r=await fetch('ihaleler.json?t='+Date.now());
if(r.ok){
const live=await r.json();
const local=JSON.parse(localStorage.getItem('myTendersV2'))||[];
const titles=new Set(live.map(x=>x.title));
T=[...live,...local.filter(x=>!titles.has(x.title))];
document.getElementById('syncStatus').textContent="● "+T.length+" İhale";
render();
}
}catch(e){}
}

function render(ft=""){
const ly=document.getElementById('pins'),st=document.getElementById('strip');let svg="",str="";
C.forEach(c=>{
const ac=T.filter(t=>t.city===c.n&&t.status==='active').length,isA=ac>0,r=isA?12:8.5;
svg+=`<g onclick="openD('${c.n}')" style="cursor:pointer"><circle cx="${c.x}" cy="${c.y}" r="${r}" fill="${isA?'#f59e0b':'#1e293b'}" stroke="${isA?'#fff':'#64748b'}" stroke-width="${isA?2.5:1.5}"/><text x="${c.x}" y="${c.y+3.2}" font-size="8.5" font-weight="bold" fill="${isA?'#0f172a':'#94a3b8'}" text-anchor="middle">${isA?ac:c.p}</text><text x="${c.x}" y="${c.y+r+8.5}" font-size="7.5" font-weight="600" fill="${isA?'#fbbf24':'#94a3b8'}" text-anchor="middle">${c.n}</text></g>`;
if(!ft||c.n.toLowerCase().includes(ft.toLowerCase())||c.p.includes(ft)){str+=`<div class="chip ${isA?'act':''}" onclick="openD('${c.n}')">${c.p} ${c.n} <span>${ac}</span></div>`}
});ly.innerHTML=svg;st.innerHTML=str;
}
function openD(cn){
curC=cn;document.getElementById('sc').textContent=cn+" İhaleleri";
const co=C.find(c=>c.n===cn),ds=document.getElementById('df');
ds.innerHTML='<option value="ALL">Tüm İlçeler ('+cn+')</option>';
if(co&&co.d)co.d.split(',').forEach(d=>ds.innerHTML+=`<option value="${d}">${d}</option>`);
T.filter(t=>t.city===cn&&t.district).forEach(t=>{if(![...ds.options].some(o=>o.value===t.district))ds.innerHTML+=`<option value="${t.district}">${t.district}</option>`});
document.getElementById('drw').classList.add('open');rList();
}
function closeD(){document.getElementById('drw').classList.remove('open')}
function sTab(t){curTab=t;document.getElementById('ta').classList.toggle('active',t==='active');document.getElementById('tp').classList.toggle('active',t==='past');rList()}
function sTyp(t){curType=t;['ALL','Hizmet','Yapım'].forEach(x=>document.getElementById('t'+x).classList.toggle('active',x===t));rList()}
function rList(){
const el=document.getElementById('list'),sd=document.getElementById('df').value;
const fl=T.filter(t=>t.city===curC&&t.status===curTab&&(sd==="ALL"||(t.district&&t.district.toLowerCase()===sd.toLowerCase()))&&(curType==="ALL"||t.type===curType));
if(!fl.length){el.innerHTML='<div class="emp">Bu filtrede ihale bulunmuyor.</div>';return}
el.innerHTML=fl.map(t=>{const ri=T.indexOf(t);return `<div class="card" onclick="sDet(${ri})"><div class="bdgs"><span class="bdg ${t.status==='active'?'ba':'bp'}">${t.status==='active'?'● OLACAK':'✓ OLMUŞ'}</span><span class="bdg ${t.type==='Hizmet'?'bh':'by'}">${t.type==='Hizmet'?'HİZMET ALIMI':'YAPIM İŞİ'}</span>${t.district?`<span class="bdg bd">📍 ${t.district}</span>`:''}</div><h3>${t.title}</h3><p>${t.org||''}</p><div class="cm"><span>📅 ${t.date}</span><span>Detay →</span></div></div>`}).join('');
}
function sDet(i){
const t=T[i];
document.getElementById('dc').innerHTML=`<div class="dr"><span>İhale Adı</span><strong>${t.title}</strong></div><div class="dr"><span>Konum</span>${t.city} / ${t.district||'Merkez'}</div><div class="dr"><span>Tür & Durum</span>${t.type} İşi — ${t.status==='active'?'Olacak':'Olmuş'}</div><div class="dr"><span>Kurum</span>${t.org||'-'}</div><div class="dr"><span>Kapsam</span>${t.desc||'-'}</div><div class="dr"><span>İKN & Tarih</span>${t.date}</div>`;
document.getElementById('dm').classList.add('open');
}
function closeDet(){document.getElementById('dm').classList.remove('open')}
function openM(){document.getElementById('am').classList.add('open')}
function closeM(){document.getElementById('am').classList.remove('open')}
function swMode(m){
document.getElementById('mSingle').classList.toggle('active',m==='single');
document.getElementById('mBulk').classList.toggle('active',m==='bulk');
document.getElementById('boxSingle').style.display=m==='single'?'block':'none';
document.getElementById('boxBulk').style.display=m==='bulk'?'block':'none';
}
function save(){
const city=document.getElementById('ic').value,district=document.getElementById('idst').value.trim()||"Merkez",type=document.getElementById('itp').value,status=document.getElementById('ist').value,title=document.getElementById('itl').value.trim(),org=document.getElementById('ior').value.trim(),desc=document.getElementById('idc').value.trim(),date=document.getElementById('idt').value.trim();
if(!title){alert("İhale başlığını yazın.");return}
const item={city,district,type,status,title,org,desc,date};
T.unshift(item);
const local=JSON.parse(localStorage.getItem('myTendersV2'))||[];local.unshift(item);
localStorage.setItem('myTendersV2',JSON.stringify(local));
document.getElementById('syncStatus').textContent="● "+T.length+" İhale";
render();closeM();openD(city);['idst','itl','ior','idc','idt'].forEach(x=>document.getElementById(x).value='');
}
function saveBulk(){
const lines=document.getElementById('bulkTxt').value.split('\n').map(x=>x.trim()).filter(Boolean);
if(!lines.length){alert("Lütfen listeyi yapıştırın.");return}
const local=JSON.parse(localStorage.getItem('myTendersV2'))||[];
let added=0;
lines.forEach(line=>{
const parts=line.split('|').map(x=>x.trim());
const city=parts.shift();
const district=parts.shift()||"Merkez";
const type=parts.shift()||"Yapım";
const status=parts.shift()||"past";
const title=parts.shift();
const org=parts.shift()||"EKAP";
const date=parts.shift()||"";
if(city && title){
const item={city,district,type,status,title,org,desc:title,date};
T.unshift(item);local.unshift(item);added++;
}
});
localStorage.setItem('myTendersV2',JSON.stringify(local));
document.getElementById('syncStatus').textContent="● "+T.length+" İhale";
document.getElementById('bulkTxt').value='';
render();closeM();alert(added+" adet ihale haritaya eklendi!");
}
