name: Gunluk Ihale Guncelleme
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python bot.py
      - run: |
          git config user.name "IhaleBot"
          git config user.email "bot@github.com"
          git add ihaleler.json
          git commit -m "Guncel ihaleler" || exit 0
          git push
          
